server:
  port: 12061

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:

        # ===== AUTHENTICATION API =====
        - id: auth-register
          uri: http://api-user:12063
          predicates:
            - Path=/api/auth/register
          filters:
            - StripPrefix=1

        - id: auth-login
          uri: http://api-user:12063
          predicates:
            - Path=/api/auth/login
          filters:
            - StripPrefix=1

        - id: auth-protected
          uri: http://api-user:12063
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        # ===== USER API =====
        - id: user-create
          uri: http://api-user:12063
          predicates:
            - Path=/api/user
            - Method=POST
          filters:
            - StripPrefix=1

        - id: user-get-by-pseudo
          uri: http://api-user:12063
          predicates:
            - Path=/api/user/{pseudo}
            - Method=GET
          filters:
            - StripPrefix=1

        - id: user-protected
          uri: http://api-user:12063
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
            #- AuthenticationFilter

        # ===== SCRAPING API ===== (avant artist-api !)
        - id: scraping-movies
          uri: http://api-scrapping:12062
          predicates:
            - Path=/api/movies/batch/**
          filters:
            - StripPrefix=1
            #- AuthenticationFilter

        - id: scraping-artists
          uri: http://api-scrapping:12062
          predicates:
            - Path=/api/artists/batch/**
          filters:
            - StripPrefix=1
            #- AuthenticationFilter

        # ===== ARTIST API =====
        - id: artist-api
          uri: http://api-artist:12064
          predicates:
            - Path=/api/artists/**
          filters:
            - StripPrefix=0
            #- AuthenticationFilter

        # ===== REVIEW API =====
        - id: review-read
          uri: http://api-reviews:12064
          predicates:
            - Path=/api/reviews/**
            - Method=GET
          filters:
            - StripPrefix=0

        - id: review-write
          uri: http://api-reviews:12064
          predicates:
            - Path=/api/reviews/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter

        # ===== PAYMENT API =====
        - id: payment-api
          uri: http://host.docker.internal:12066
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        # ===== RESERVATION API =====
        - id: reservation-api
          uri: http://host.docker.internal:12067
          predicates:
            - Path=/api/reservations/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

        # ===== POSTER API =====
        - id: poster-read
          uri: http://host.docker.internal:12068
          predicates:
            - Path=/api/posters/**
            - Method=GET
          filters:
            - StripPrefix=1

        - id: poster-write
          uri: http://host.docker.internal:12068
          predicates:
            - Path=/api/posters/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

      # Configuration CORS globale
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:12060"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: "hashage_from_the_bios is the biography of a legend : the BIOS"
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG