services:
  db:
    image: mariadb:latest
    container_name: artist
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: mdp_super_secret
      MARIADB_DATABASE: nom_de_ma_db
      MARIADB_USER: abadacor
      MARIADB_PASSWORD: abadacor
    ports:
      - "9999:3306"  # Accessible depuis ton host si besoin
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    container_name: mon-api
    ports:
      - "8080:8080"
    environment:
      # Connexion à MariaDB via le service 'db' (pas localhost)
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/nom_de_ma_db
      SPRING_DATASOURCE_USERNAME: abadacor
      SPRING_DATASOURCE_PASSWORD: abadacor
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.mariadb.jdbc.Driver
    depends_on:
      - db

volumes:
  db_data:

    //ajouter le docker file